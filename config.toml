# Kona Flight Tracker configuration
#
# Every tunable lives here; nothing is hardcoded in source. Units are noted
# per field. To change a setting on the Pi without fighting `git pull`, put
# just that key in a file named config.local.toml next to this one (it is
# git-ignored and overrides this file), for example:
#
#     [display]
#     max_rows = 6

[location]
# Where distances and bearings are measured FROM, and the centre of the range
# rings. Decimal degrees. This is Kona International (KOA); the screen says
# "FROM KOA" to match.
lat = 19.7388
lon = -156.0456

[airport]
# The airport that defines "arriving" and "departing".
icao = "PHKO"
iata = "KOA"
name = "Kona"
elevation_ft = 47

[fetch]
# Live position sources. All listed sources are polled in turn and merged by
# aircraft; the freshest position wins. More sources = better coverage near
# Kona, where volunteer receivers are thin.
#   "airplanes_live"  airplanes.live   (1 request/s allowed, non-commercial)
#   "adsb_fi"         adsb.fi          (1 request/s allowed, personal use)
#   "adsb_lol"        adsb.lol         (no fixed limit; polled every 10 s)
#   "local"           your own receiver, see [local_receiver]
#   "replay"          offline development only, alone. Never commit that.
# Check that a source works from this network with `python3 app.py --once`
# before adding it. A source that fails just backs off; it can't hurt the rest.
sources = ["airplanes_live", "adsb_fi"]
radius_nm = 60                    # search radius, nautical miles (covers the whole map)
interval_seconds = 5              # poll interval per source (the feeds allow 1 request/second)
timeout_seconds = 8               # HTTP timeout
max_position_age_seconds = 30     # a position older than this is dropped, never drawn
stale_after_seconds = 30          # no successful poll for this long -> status dot turns amber
watchdog_seconds = 300            # no successful poll for this long -> fetch thread is restarted
show_anonymous = false            # TIS-B targets with no identity (jumpy, often duplicates)
# Replay mode: plays a recording made by tools/record.py, or the bundled
# scripted scenario. A bare name loads from data/.
replay_file = "fixtures/kona_scenario.jsonl.gz"
replay_speed = 1.0                # 2.0 = twice real time

[local_receiver]
# An RTL-SDR running readsb / dump1090-fa / tar1090, on this Pi or another box
# on the LAN. Only used when "local" is in [fetch] sources. Local data wins the
# merge while it is fresh. See the README for hardware and setup.
url = "http://127.0.0.1:8080/data/aircraft.json"
interval_seconds = 2

[enrich]
# Background lookups: routes and airframes from adsbdb.com, the altimeter
# setting from the airport's METAR. These never delay position updates.
enabled = true
min_interval_seconds = 2.0        # at most one adsbdb request this often
metar_station = ""                # blank = use [airport] icao
metar_interval_minutes = 30

[altitude]
# Below the transition altitude the feed's pressure altitude is corrected with
# the local altimeter setting, so a plane on the runway reads ~0 ft instead of
# -150 ft. At and above it, pressure altitude is shown as-is (flight levels).
transition_altitude_ft = 18000
# No "ground" flag from the transponder? Below this altitude AND slower than
# this speed still counts as on the ground.
ground_max_altitude_ft = 100
ground_max_speed_kt = 60

[classify]
vertical_rate_threshold_fpm = 250    # steeper than this counts as climbing / descending
overflight_min_altitude_ft = 10000   # level traffic above this with no Kona route = overflight
feature_dwell_seconds = 20           # minimum time a flight stays featured before another takes over

[motion]
dead_reckoning = true             # move aircraft along their track between position updates
tween_seconds = 1.0               # glide to a new position over this long instead of jumping
trail_seconds = 180               # length of the track history kept per aircraft

[display]
width = 1920                      # set to the monitor's native resolution
height = 1080
fps = 6                           # render loop frame rate; 5-10 is plenty
speed_units = "kt"                # "kt" (matches FlightRadar24), "mph", or "kmh"
distance_units = "mi"             # "mi" (statute), "nm", or "km"
altitude_units = "ft"             # "ft" or "m"
max_rows = 7                      # max aircraft rows in the left-panel table (excluding the featured flight)
fullscreen = true                 # true on the Pi; false for windowed dev on a laptop
timezone = "Pacific/Honolulu"     # the clock and quiet hours use this, not the Pi's own setting
clock_24h = false                 # false = 4:38 PM, true = 16:38

[appliance]
# Memory backstop. Use is logged once an hour; if it ever passes this many MB
# the app exits and the launcher restarts it. Normal use is well under 150 MB.
# 0 turns the check off.
max_rss_mb = 300

[quiet_hours]
enabled = true
start = "22:00"                   # local time in [display] timezone, 24h format
end = "07:00"
brightness = 0.30                 # brightness multiplier during quiet hours (0.0-1.0)

[map]
# RIGHT-HALF MAP.
enabled = true
# Map image for the right 960x1080 half, baked by tools/make_map.py from
# public-domain coastline data. A bare filename loads from data/; an absolute
# path loads your own map (it must match the bounds below).
image = "big_island_map.png"
# Geographic bounds of the map image edges: these are the calibration. They
# are chosen so one nautical mile is the same number of pixels north-south and
# east-west (the island is its true shape and range rings are circles):
# 108 nm tall, 96 nm wide, 10 px per nm. To change the crop, let the tool do
# the arithmetic, then paste what it prints here:
#     python3 tools/make_map.py --fit 108 --center 19.60 -155.661
lat_max = 20.5000                 # top edge of the image
lat_min = 18.7000                 # bottom edge
lon_min = -156.5102               # left edge
lon_max = -154.8118               # right edge
# Aircraft icon. Bare name -> data/; absolute path -> your own plane.png.
# If the file is missing, a clean vector plane is drawn instead.
plane_icon = "plane.png"
plane_size = 34                   # icon size in px (square, before rotation)
show_range_rings = true           # labelled distance rings centred on [location]
range_ring_step = 10              # spacing between rings, in [display] distance_units
show_home = true                  # marker at the [location] point
show_labels = true                # flight label next to each aircraft on the map
show_trails = true                # fading track behind each airborne aircraft
show_offmap_pointers = true       # edge chevron for tracked aircraft outside the map crop
icon_shapes = true                # helicopters and light props get their own silhouettes; false = one plane icon for all
